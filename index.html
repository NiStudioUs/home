<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/home/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Ni Studio Us builds private, offline-first mobile apps — notes, finance, alarm clock, and family history — with clean architecture and no ads.">
  <meta name="keywords" content="Flutter, Android, Mobile Apps, Offline-First, Private Apps, Ni Studio Us, Karthik Subramanian, IKY, Scribble Notes, SMS Stack">
  <meta name="author" content="Karthik Subramanian (Ni Studio Us)">

  <!-- OpenGraph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nistudious.github.io/home/">
  <meta property="og:title" content="Ni Studio Us — Private, Offline-First Mobile Apps">
  <meta property="og:description" content="Your phone. Your data. Nobody else. Notes, finance, and family history mobile apps with zero ads and total privacy.">
  <meta property="og:image" content="https://nistudious.github.io/home/icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://nistudious.github.io/home/">
  <meta name="twitter:title" content="Ni Studio Us — Private, Offline-First Mobile Apps">
  <meta name="twitter:description" content="Your phone. Your data. Nobody else. Notes, finance, and family history mobile apps with zero ads and total privacy.">
  <meta name="twitter:image" content="https://nistudious.github.io/home/icons/Icon-512.png">
  
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="IFmn3wMBC252N0lkARAt4M6GzBLJOn_1EZZ80SCdVo4" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ni Studio Us">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preconnect and Stylesheet for zero-latency fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="manifest" href="manifest.json">

  <!-- GitHub Pages SPA Route Restore Script -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #fbfbfe;
    }
    @media (prefers-color-scheme: dark) {
      body, html {
        background-color: #0b0b0e;
      }
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-logo {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #1a1a24;
      margin-bottom: 24px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @media (prefers-color-scheme: dark) {
      .loading-logo {
        color: #fbfbfe;
      }
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(100, 108, 255, 0.2);
      border-radius: 50%;
      border-top-color: #646cff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .static-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 16px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      border-top: 1px solid #e0e0e0;
      z-index: 9999;
      box-sizing: border-box;
    }
    .static-footer a {
      color: #646cff;
      text-decoration: none;
      white-space: nowrap;
      padding: 2px 4px;
    }
    .static-footer a:hover {
      text-decoration: underline;
    }
    .static-footer .footer-sep {
      color: #a0a0b0;
      user-select: none;
    }
    @media (max-width: 600px) {
      .static-footer {
        padding: 8px 12px;
        gap: 6px 10px;
        font-size: 11px;
      }
      .static-footer .footer-sep {
        display: none;
      }
    }
    @media (prefers-color-scheme: dark) {
      .static-footer {
        background: rgba(11, 11, 14, 0.95);
        border-top: 1px solid #1a1a24;
      }
      .static-footer a {
        color: #8c92ff;
      }
      .static-footer .footer-sep {
        color: #3b3b4a;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen (Visible immediately) -->
  <div id="loading-screen" class="loading-container">
    <div class="loading-logo">Ni Studio Us</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Static privacy policy links for crawlers & mobile friendly display -->
  <div id="static-footer" class="static-footer">
    <a href="#/app/sms-stack/privacy">SMS Stack Privacy</a>
    <span class="footer-sep">·</span>
    <a href="#/app/sms-stack/terms">SMS Stack Terms</a>
    <span class="footer-sep">·</span>
    <a href="#/app/scribble_notes/privacy">Scribble Notes Privacy</a>
    <span class="footer-sep">·</span>
    <a href="#/app/scribble_notes/terms">Scribble Notes Terms</a>
  </div>
  
  <script>
    // Hide static footer and loading screen when Flutter actually paints
    function hideStaticContent() {
      var footer = document.getElementById('static-footer');
      var loader = document.getElementById('loading-screen');
      if (footer) footer.style.display = 'none';
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease-out';
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }
    
    // Check for rendered content: wait until Flutter view has width/height or canvas is attached
    var checkInterval = setInterval(function() {
      var fltView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      var canvas = document.querySelector('canvas');
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        // Wait one animation frame so the initial paint is visible on screen before fading
        requestAnimationFrame(function() {
          hideStaticContent();
        });
        clearInterval(checkInterval);
      } else if (fltView) {
        // Fallback for html renderer or custom elements
        setTimeout(function() {
          hideStaticContent();
        }, 150);
        clearInterval(checkInterval);
      }
    }, 50);
    
    // Safety fallback: hide after 8 seconds
    setTimeout(function() {
      hideStaticContent();
      clearInterval(checkInterval);
    }, 8000);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
