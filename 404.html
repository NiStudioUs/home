<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages Single Page App routing script (rafgraph/spa-github-pages)
    // Converts 404 path into a query parameter redirect so index.html can restore the route.
    var pathSegmentsToKeep = 1; // '/home/' is segment 0, so keep 1 segment

    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    var target = l.protocol + '//' + l.host + '/' + l.pathname.slice(1).split('/')[0] + '/?/' +
      path +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash;

    l.replace(target);
  </script>
</head>
<body>
</body>
</html>
