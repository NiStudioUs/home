<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced at build time by `flutter build web --base-href`.
  -->
  <base href="/home/app/alarm-clock/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Alarms, reminders, timers and a stopwatch in one calm clock app.">
  <meta name="theme-color" content="#F97003">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alarm Clock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alarm Clock</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #FFF8F4; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1C1B1F; }
    }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity .3s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .bar {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(249, 112, 3, .2);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #F97003; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Alarm Clock">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    // Hide the splash once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
