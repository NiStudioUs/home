<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="/home/app/scribble-notes/demo/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta content="Your notes, checklists, diaries and plans in one workspace." name="description">

    <!-- iOS meta tags & icons -->
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black" name="apple-mobile-web-app-status-bar-style">
    <meta content="Scribble Notes" name="apple-mobile-web-app-title">

    <link href="icons/Icon-192.png?v=962b1ead3753" rel="apple-touch-icon">

    <!-- Favicon -->
    <link href="favicon.png?v=962b1ead3753" rel="icon" type="image/png"/>

    <!-- Google Sign-In OAuth client ID for web (GIS SDK used by google_sign_in v6+) -->
    <meta name="google-signin-client_id" content="264532754957-6oshpqgq9rtdl8q6qlt8okaavgfigj3a.apps.googleusercontent.com">

    <title>Scribble Notes</title>
    <link href="manifest.json?v=962b1ead3753" rel="manifest">

    <!-- CanvasKit is fetched from gstatic; open the connection early. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <!-- Shown while main.dart.js and CanvasKit download; removed on the first Flutter frame. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; }
      #app-loading {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #ffffff;
      }
      #app-loading img { width: 80px; height: 80px; border-radius: 20px; }
      #app-loading .spinner {
        position: absolute; top: calc(50% + 64px); width: 32px; height: 32px;
        border: 3px solid rgba(0, 0, 0, 0.12); border-top-color: #00A36C;
        border-radius: 50%; animation: app-spin 0.9s linear infinite;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, body, #app-loading { background: #000000; }
        #app-loading .spinner { border-color: rgba(255, 255, 255, 0.16); border-top-color: #00A36C; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .spinner { animation-duration: 2.4s; }
      }
    </style>
</head>
<body>
<div id="app-loading" aria-label="Loading">
  <img src="icons/Icon-192.png?v=962b1ead3753" alt="">
  <div class="spinner"></div>
</div>
<script>
  window.addEventListener('flutter-first-frame', function () {
    var el = document.getElementById('app-loading');
    if (el) el.remove();
  });
</script>
<script src="flutter_bootstrap.js" async>
</script>
</body>
</html>
