name: Playwright Native Container (Option 1)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of workers (Use 1 for sequential, 4 for parallel)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '4'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Tell GitHub Actions to run this whole job inside the Playwright Docker image natively!
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    defaults:
      run:
        working-directory: apps/learning/apps/chapter-1

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: npm ci

    - name: Run Playwright tests
      run: npx playwright test --workers=${{ github.event.inputs.workers }}
      env:
        BASE_URL: https://nistudious.github.io/home/learning/apps/chapter-1

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: apps/learning/apps/chapter-1/reports/html/
        retention-days: 14

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: apps/learning/apps/chapter-1/reports/allure-results/
        retention-days: 14
