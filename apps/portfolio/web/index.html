<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="IFmn3wMBC252N0lkARAt4M6GzBLJOn_1EZZ80SCdVo4" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nistudious_website">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>nistudious_website</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #fbfbfe;
    }
    @media (prefers-color-scheme: dark) {
      body, html {
        background-color: #0b0b0e;
      }
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-logo {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #1a1a24;
      margin-bottom: 24px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @media (prefers-color-scheme: dark) {
      .loading-logo {
        color: #fbfbfe;
      }
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(100, 108, 255, 0.2);
      border-radius: 50%;
      border-top-color: #646cff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .static-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      border-top: 1px solid #e0e0e0;
      z-index: 9999;
    }
    .static-footer a {
      color: #646cff;
      text-decoration: none;
      margin: 0 12px;
    }
    .static-footer a:hover {
      text-decoration: underline;
    }
    @media (prefers-color-scheme: dark) {
      .static-footer {
        background: rgba(11, 11, 14, 0.95);
        border-top: 1px solid #1a1a24;
      }
      .static-footer a {
        color: #8c92ff;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen (Visible immediately) -->
  <div id="loading-screen" class="loading-container">
    <div class="loading-logo">Ni Studio Us</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Static privacy policy links for crawlers -->
  <div id="static-footer" class="static-footer">
    <a href="#/app/sms-stack/privacy">SMS Stack Manager Privacy Policy</a> | 
    <a href="#/app/sms-stack/terms">SMS Stack Manager Terms</a> | 
    <a href="#/app/scribble_notes/privacy">Scribble Notes Privacy Policy</a> | 
    <a href="#/app/scribble_notes/terms">Scribble Notes Terms</a>
  </div>
  
  <script>
    // Hide static footer and loading screen when Flutter renders
    function hideStaticContent() {
      var footer = document.getElementById('static-footer');
      var loader = document.getElementById('loading-screen');
      if (footer) footer.style.display = 'none';
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease-out';
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
      }
    }
    
    // Check for Flutter's canvas element
    var checkInterval = setInterval(function() {
      if (document.querySelector('flt-glass-pane') || 
          document.querySelector('flutter-view') ||
          document.querySelector('canvas')) {
        hideStaticContent();
        clearInterval(checkInterval);
      }
    }, 100);
    
    // Fallback: hide after 10 seconds regardless
    setTimeout(function() {
      hideStaticContent();
      clearInterval(checkInterval);
    }, 10000);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
