  <!-- GitHub Pages SPA Route Restore Script -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #fbfbfe;
    }
    @media (prefers-color-scheme: dark) {
      body, html {
        background-color: #0b0b0e;
      }
    }
    /* Instant HTML Skeleton Loading Screen */
    .skeleton-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fbfbfe;
      z-index: 9998;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (prefers-color-scheme: dark) {
      .skeleton-screen {
        background-color: #0b0b0e;
      }
    }
    
    /* Shimmer Animation */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .sk-bone {
      background: linear-gradient(90deg, #ececf4 25%, #f7f7fa 50%, #ececf4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      .sk-bone {
        background: linear-gradient(90deg, #161620 25%, #252535 50%, #161620 75%);
        background-size: 200% 100%;
      }
    }

    /* Topbar Skeleton */
    .sk-topbar {
      height: 64px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      .sk-topbar {
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
    }
    .sk-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sk-nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .sk-nav-links { display: none; }
    }

    /* Hero Skeleton Container */
    .sk-hero {
      max-width: 1160px;
      width: 100%;
      margin: 14px auto 0;
      padding: 0 16px;
      box-sizing: border-box;
      display: flex;
      gap: 36px;
    }
    .sk-hero-left {
      flex: 1.35;
      display: flex;
      flex-direction: column;
    }
    .sk-hero-right {
      flex: 0.65;
      display: flex;
      justify-content: center;
      position: relative;
    }
    @media (max-width: 900px) {
      .sk-hero { flex-direction: column; gap: 24px; }
      .sk-hero-right { display: none; }
    }

    /* Floating phone mockup skeleton */
    .sk-phone {
      width: 210px;
      height: 430px;
      border-radius: 28px;
      border: 4px solid #ececf4;
      box-shadow: 0 12px 36px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .sk-phone {
        border-color: #1a1a26;
        box-shadow: 0 12px 36px rgba(0,0,0,0.4);
      }
    }

    .static-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 16px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      border-top: 1px solid #e0e0e0;
      z-index: 9999;
      box-sizing: border-box;
    }
    .static-footer a {
      color: #646cff;
      text-decoration: none;
      white-space: nowrap;
      padding: 2px 4px;
    }
    .static-footer a:hover {
      text-decoration: underline;
    }
    .static-footer .footer-sep {
      color: #a0a0b0;
      user-select: none;
    }
    @media (max-width: 600px) {
      .static-footer {
        padding: 8px 12px;
        gap: 6px 10px;
        font-size: 11px;
      }
      .static-footer .footer-sep {
        display: none;
      }
    }
    @media (prefers-color-scheme: dark) {
      .static-footer {
        background: rgba(11, 11, 14, 0.95);
        border-top: 1px solid #1a1a24;
      }
      .static-footer a {
        color: #8c92ff;
      }
      .static-footer .footer-sep {
        color: #3b3b4a;
      }
    }
  </style>

<body>
  <!-- Instant HTML/CSS Shimmering Skeleton Screen (Renders at 0ms) -->
  <div id="loading-screen" class="skeleton-screen">
    <!-- Topbar Wireframe -->
    <div class="sk-topbar">
      <div class="sk-brand">
        <div class="sk-bone" style="width: 32px; height: 32px; border-radius: 9px;"></div>
        <div class="sk-bone" style="width: 90px; height: 18px;"></div>
      </div>
      <div class="sk-nav-links">
        <div class="sk-bone" style="width: 44px; height: 14px;"></div>
        <div class="sk-bone" style="width: 58px; height: 14px;"></div>
        <div class="sk-bone" style="width: 120px; height: 14px;"></div>
        <div class="sk-bone" style="width: 50px; height: 14px;"></div>
        <div class="sk-bone" style="width: 28px; height: 28px; border-radius: 50%;"></div>
      </div>
    </div>

    <!-- Hero Wireframe -->
    <div class="sk-hero">
      <div class="sk-hero-left">
        <!-- Live Pill -->
        <div class="sk-bone" style="width: 180px; height: 30px; border-radius: 999px; margin-bottom: 22px;"></div>
        <!-- H1 Headline -->
        <div class="sk-bone" style="width: 82%; height: 52px; margin-bottom: 12px;"></div>
        <div class="sk-bone" style="width: 60%; height: 52px; margin-bottom: 24px;"></div>
        <!-- Subtitle Lead -->
        <div class="sk-bone" style="width: 90%; height: 18px; margin-bottom: 8px;"></div>
        <div class="sk-bone" style="width: 75%; height: 18px; margin-bottom: 28px;"></div>
        <!-- Action Buttons -->
        <div style="display: flex; gap: 12px; margin-bottom: 36px;">
          <div class="sk-bone" style="width: 145px; height: 44px; border-radius: 999px;"></div>
          <div class="sk-bone" style="width: 145px; height: 44px; border-radius: 999px;"></div>
        </div>
        <!-- Spotlight Card -->
        <div class="sk-bone" style="width: 100%; max-width: 440px; height: 74px; border-radius: 18px;"></div>
      </div>

      <!-- Right Phone Wireframe -->
      <div class="sk-hero-right">
        <div class="sk-bone sk-phone"></div>
      </div>
    </div>
  </div>

  <!-- Static privacy policy links for crawlers & mobile friendly display -->
  <div id="static-footer" class="static-footer">
    <a href="#/app/sms-stack/privacy">SMS Stack Privacy</a>
    <span class="footer-sep">·</span>
    <a href="#/app/sms-stack/terms">SMS Stack Terms</a>
    <span class="footer-sep">·</span>
    <a href="#/app/scribble_notes/privacy">Scribble Notes Privacy</a>
    <span class="footer-sep">·</span>
    <a href="#/app/scribble_notes/terms">Scribble Notes Terms</a>
  </div>
  
  <script>
    // Hide static footer and loading screen when Flutter actually paints
    function hideStaticContent() {
      var footer = document.getElementById('static-footer');
      var loader = document.getElementById('loading-screen');
      if (footer) footer.style.display = 'none';
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease-out';
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }
    
    // Check for rendered content: wait until Flutter view has width/height or canvas is attached
    var checkInterval = setInterval(function() {
      var fltView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      var canvas = document.querySelector('canvas');
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        // Wait one animation frame so the initial paint is visible on screen before fading
        requestAnimationFrame(function() {
          hideStaticContent();
        });
        clearInterval(checkInterval);
      } else if (fltView) {
        // Fallback for html renderer or custom elements
        setTimeout(function() {
          hideStaticContent();
        }, 150);
        clearInterval(checkInterval);
      }
    }, 50);
    
    // Safety fallback: hide after 8 seconds
    setTimeout(function() {
      hideStaticContent();
      clearInterval(checkInterval);
    }, 8000);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
