  <script>
    // Hide static footer and loading screen when Flutter actually paints
    var staticHidden = false;
    function hideStaticContent() {
      if (staticHidden) return;
      staticHidden = true;
      var footer = document.getElementById('static-footer');
      var loader = document.getElementById('loading-screen');
      if (footer) footer.style.display = 'none';
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease-out';
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 400);
      }
    }
    
    // Primary trigger: Flutter fires 'flutter-first-frame' right after first layout & paint
    window.addEventListener('flutter-first-frame', function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          hideStaticContent();
        });
      });
      clearInterval(checkInterval);
    });

    // Secondary check: verify actual non-empty canvas paint (document or flutter-view shadowRoot)
    var checkInterval = setInterval(function() {
      var fltView = document.querySelector('flutter-view');
      var shadowCanvas = fltView && fltView.shadowRoot ? fltView.shadowRoot.querySelector('canvas') : null;
      var canvas = document.querySelector('canvas') || shadowCanvas;
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            hideStaticContent();
          });
        });
        clearInterval(checkInterval);
      }
    }, 50);
    
    // Safety fallback: hide after 10 seconds if no event fired
    setTimeout(function() {
      hideStaticContent();
      clearInterval(checkInterval);
    }, 10000);
  </script>

<p>human-readable place name (e.g. &quot;Koramangala, Bengaluru&quot;) instead of raw</p>
<p>coordinates. To do this, it sends the latitude/longitude You selected to</p>
<p><strong>OpenStreetMap&#039;s Nominatim API</strong> (<code>nominatim.openstreetmap.org</code>), a</p>
<p>third-party, independently-operated service not owned by Us.</p>

</ul>
<p>  location-based routine; it is not a background or periodic call.</p>
