  <script>
    // Hide static footer and loading screen when Flutter actually paints
    var staticHidden = false;
    function hideStaticContent() {
      if (staticHidden) return;
      staticHidden = true;
      var footer = document.getElementById('static-footer');
      var loader = document.getElementById('loading-screen');
      if (footer) footer.style.display = 'none';
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease-out';
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 400);
      }
    }
    
    // Primary trigger: Flutter fires 'flutter-first-frame' right after first layout & paint
    window.addEventListener('flutter-first-frame', function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          hideStaticContent();
        });
      });
      clearInterval(checkInterval);
    });

    // Secondary check: verify actual non-empty canvas paint (document or flutter-view shadowRoot)
    var checkInterval = setInterval(function() {
      var fltView = document.querySelector('flutter-view');
      var shadowCanvas = fltView && fltView.shadowRoot ? fltView.shadowRoot.querySelector('canvas') : null;
      var canvas = document.querySelector('canvas') || shadowCanvas;
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            hideStaticContent();
          });
        });
        clearInterval(checkInterval);
      }
    }, 50);
    
    // Safety fallback: hide after 10 seconds if no event fired
    setTimeout(function() {
      hideStaticContent();
      clearInterval(checkInterval);
    }, 10000);
  </script>

<li><strong>Alarms (<code>SCHEDULE_EXACT_ALARM</code>)</strong>: Required to schedule precise reminders for upcoming Bill Due Dates.</li>
<li><strong>Foreground Service &amp; Data Sync (<code>FOREGROUND_SERVICE</code>, <code>FOREGROUND_SERVICE_DATA_SYNC</code>)</strong>: Runs the dedicated <code>SyncForegroundService</code> while encrypting, compressing, and uploading or downloading your cloud backup snapshot. This helps keep your user-initiated backup or restore running in the background if you switch apps or lock your screen, though Android may still terminate the process under memory pressure or OEM battery restrictions.</li>
<li><strong>Battery Optimization Exemption (<code>REQUEST_IGNORE_BATTERY_OPTIMIZATIONS</code>)</strong>: Used optionally to prevent aggressive OEM background app killers from silencing scheduled bill reminders and interrupting automated backups.</li>
<li><strong>Biometric (<code>USE_BIOMETRIC</code>)</strong>: Used for the optional App Lock feature to authenticate you and safeguard sensitive financial views.</li>
<li><strong>Vibration (<code>VIBRATE</code>)</strong>: Used for tactile feedback on high-priority alerts and notifications.</li>
<li><strong>Boot Completed (<code>RECEIVE_BOOT_COMPLETED</code>)</strong>: Required to re-register scheduled bill reminder alarms and SMS broadcast listeners after your phone restarts.</li>
</ul>
      
        <h3>Network Usage</h3>
        <ul>
<li><strong>Internet (<code>INTERNET</code>)</strong>: The app uses internet access <strong>strictly</strong> for:</li>
<li>Fetching parser rule updates (Firebase Remote Config).</li>
<li>Performing encrypted backups (Google Drive API).</li>
<li><strong>No SMS data is ever sent to our servers.</strong></li>
</ul>
      
    
      <h2>Data Processing</h2>
      
        <h3>Parsing (Regex Engine)</h3>
        <p>When an SMS is received, it is processed by the on-device <code>SmsParserEngine</code>. This engine uses a set of Regular Expression rules to identify patterns (like &quot;INR 500 debited&quot;). This processing happens <strong>entirely in your phone&#039;s secure memory</strong>.</p>
      
        <h3>Storage (SQLite)</h3>
        <p>All extracted data (Accounts, Transactions, Bills, Logs) is stored in a private <code>SQLite</code> database located in the app&#039;s secure sandbox. Other apps cannot access this data.</p>
      
    
      <h2>Cloud Services</h2>
      
        <h3>Google Drive Sync</h3>
        <p>If you enable Cloud Backup:</p>
<ul>
<li>Your data is serialized to JSON and GZIP compressed.</li>
<li>Data is <strong>End-to-End Encrypted</strong> (AES-256-GCM) locally before upload using a key derived from your custom password.</li>
<li>The encrypted file is uploaded to a hidden <code>appDataFolder</code> in your personal Google Drive storage.</li>
</ul>
<p><strong>We cannot decrypt or read your data.</strong></p>
<p>### How to Delete Your Cloud Data</p>
<p>You can permanently delete your cloud backup data at any time via two simple methods:</p>
<ul>
<li><strong>Directly in the App</strong>: Open <strong>Settings</strong> -&gt; <strong>Cloud Backup</strong> -&gt; scroll to the <strong>Danger Zone</strong> -&gt; tap <strong>Delete Backup</strong>. This immediately and permanently deletes the encrypted backup file (<code>sms_stack_backup.enc</code> and historical rotation slots) from your Google Drive <code>appDataFolder</code> and clears local backup state.</li>
<li><strong>Via Google Drive on the Web</strong>: Go to [drive.google.com/drive/settings](https://drive.google.com/drive/settings) -&gt; click <strong>Manage Apps</strong> -&gt; locate <strong>SMS Stack</strong> -&gt; click <strong>Options</strong> -&gt; choose <strong>Delete hidden app data</strong>.</li>
</ul>
      
        <h3>Firebase Config</h3>
        <p>We use Firebase Remote Config to push updates to the SMS parsing rules. This service may collect basic metadata (Instance ID, IP Address) for service delivery, but it <strong>does not</strong> access your SMS content.</p>
